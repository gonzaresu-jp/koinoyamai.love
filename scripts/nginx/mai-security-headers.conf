# mai-security-headers.conf - セキュリティヘッダの共有スニペット
#
# なぜ snippet なのか（2026-10-21 実測）:
#   nginx の `add_header` は、**Location ブロック内に 1 つでも add_header があると
#   server レベルの add_header を継承しない**（nginx 1.24 の仕様）。
#   公開 vhost は Cache-Control / Pragma / Expires を Location ごとに書いていたため、
#   server レベルに置いていた CSP / X-Frame-Options などが
#   **PHP を配信するページ（サイトの本体）からは全く出ていなかった**。
#   → 結果として公開ページが クリックジャッキング（X-Frame-Options なし）と
#     CSP による XSS 緩和の双方から無防備になっていた。
#
# 使い方:
#   - /etc/nginx/snippets/ にこのファイルを配置する
#   - add_header を自前で持つ Location ブロックから include する
#     （Node API へ proxy する Location は除く。API 側は helmet が同じヘッダを返すため）
#   - 適用は ~/apply-nginx-security-headers.sh（dry-run → --apply）
#
# 内容:
#   - Content-Security-Policy: script-src 'self'（インライン JS 不可。webui は
#     外部 JS ファイルのみなので兼容）／ frame-ancestors 'none'（クリックジャッキング対策）
#   - X-Frame-Options: DENY
#   - Referrer-Policy / Permissions-Policy / X-Content-Type-Options
#
# 注意:
#   - HSTS は Cloudflare 側で max-age=0 に上書きされている（実測）。
#     Origin のこのヘッダはブラウザには届かない。エッジ側で有効化するには
#     Cloudflare ダッシュボードの Edge Certificates → HTTP Strict Transport Security を変更する。
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src-attr 'none';" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header X-XSS-Protection "0" always;
