# mai-security-headers.conf - セキュリティヘッダの共有スニペット
#
# なぜ snippet なのか（2026-10-21 実測）:
#   nginx の `add_header` は、**Location ブロック内に 1 つでも add_header があると
#   server レベルの add_header を継承しない**（nginx 1.24 の仕様）。
#   公開 vhost は Cache-Control / Pragma / Expires を Location ごとに書いていたため、
#   server レベルに置いていた CSP / X-Frame-Options などが
#   **PHP を配信するページ（サイトの本体）からは全く出ていなかった**。
#   → 結果として公開ページが クリックジャッキング（X-Frame-Options なし）と
#     CSP による XSS 緩和の双方から無防備になっていた。
#
# 使い方:
#   - /etc/nginx/snippets/ にこのファイルを配置する
#   - add_header を自前で持つ Location ブロックから include する
#     （Node API へ proxy する Location は除く。API 側は helmet が同じヘッダを返すため）
#   - 適用は ~/apply-nginx-security-headers.sh（dry-run → --apply）
#     ※ **スニペットの配置ogglingたら設定を差替えないこと**（nginx -t が失敗して
#       サイト全体が止まる。適用スクリプトが配置を先に行う）。
#
# CSP について（2026-10-21 headless Chrome で 11 ページを実測して決めた値）:
#   - `script-src 'unsafe-inline'` を**現時点では含める**。
#     インライン <script>（index.php の Google Fonts 読み込みなど）と
#     インラインハンドラ（onclick=... が 15 箇所）があり、
#     これを許可しないと**全ページのログイン/ログアウトボタンと週次ナビゲーションが
#     動かなくなる**（実測: script-src-attr 'none' で onclick が全滅）。
#   - 外部 JS は cdnjs.cloudflare.com（wave.php の pixi.js）と
#     unpkg.com（test.php の lottie-player）を使うため許可する。
#   - Google Fonts は style-src / font-src に追加する。
#   - **future work**: インライン script / ハンドラを `webui/js/*.js` へ外部化し、
#     `script-src 'unsafe-inline'` と `script-src-attr` を外す。
#     （AGENTS.md §11 の「webui は CSP script-src 'self'」という方針のTIA达标）
#
# 注意:
#   - HSTS は Cloudflare 側で max-age=0 に上書きされている（実測）。
#     Origin のこのヘッダはブラウザには届かない。エッジ側で有効化するには
#     Cloudflare ダッシュボードの Edge Certificates → HTTP Strict Transport Security を変更する。
#   - `upgrade-insecure-requests` は**入れない**。LAN 保険経路（http://192.168.1.72:1717）が
#     壊れるため。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header X-XSS-Protection "0" always;
