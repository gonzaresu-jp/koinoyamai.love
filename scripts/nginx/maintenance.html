<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>メンテナンス中 - 恋乃夜まい</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,158,196,.12), transparent 60%),
      radial-gradient(120% 80% at 85% 10%, rgba(140,190,255,.10), transparent 60%),
      #07070b;
    color: #e6e6ef;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 620px;
    width: 100%;
    text-align: center;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 40px 36px;
  }
  .logo { width: 168px; height: 168px; object-fit: contain; margin: 0 auto 18px; display: block; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: .06em; margin-bottom: 14px; }
  p { font-size: 15px; line-height: 1.9; color: #a9a9b8; }
  .lead { color: #d9d9e4; font-size: 16px; margin-bottom: 10px; }
  .eta {
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 13px; color: #6f6f7d; line-height: 1.9;
  }
  .eta strong { color: #ff9ec4; font-weight: 600; }
  .badge {
    display: inline-block; margin-bottom: 18px; padding: 4px 14px;
    border: 1px solid rgba(255,158,196,.45); border-radius: 999px;
    font-size: 11px; letter-spacing: .18em; color: #ff9ec4;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">MAINTENANCE</span>
    <img class="logo" src="https://koinoyamai.love/left-mai.webp" alt="恋乃夜まい" />
    <h1>現在メンテナンス中です</h1>
    <p class="lead">PHP コアの緊急セキュリティアップデート（CVE-2026-109618 / CVE-2026-109619）の<br />適用のため、公開ページを一時停止しています。</p>
    <p>見込みは <strong>本日 23:00（JST）前後</strong> のリリース公開後に対応を終え、<br />まもなく通常どおり復旧する見込みです。</p>
    <div class="eta">
      ご不便をおかけしています<br />
      <strong>通知（push）は通常どおり届きます</strong> - 配信・投稿の検知はバックグラウンドで継続中です。<br />
      復旧後、F5 / リロードで再読み込みできます。
    </div>
  </main>
</body>
</html>
