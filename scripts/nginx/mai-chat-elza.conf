# mai-chat-elza.conf — elza vhost に「まいAI チャット」の location を追加する
#
# 用途:
#   https://elza.poitou-mora.ts.net/admin.html の「まいAI チャットを開く」は
#   ./chat.html を指すが、elza vhost は root が /var/www/html（リポジトリの
#   webui ではない）のため /chat.html・/chat.js が 404 になっていた
#   （2026-11-06 実測: elza.poitou-mora.ts.net/chat.html → 404）。
#   admin.html と同じパターンで、tailnet/LAN からのみ配信できるようにする。
#
# 設計:
#   - `location = /admin.html`（tailnet/LAN 限定・webui を root に指定）と同じ。
#   - add_header Cache-Control（no-store）+ mai-security-headers.conf の include は
#     `location ^~ /admin/login/` と同じパターン。Location に add_header を 1 つでも
#     書くと server レベルのヘッダを継承しないため（AGENTS.md §11）、
#     セキュリティヘッダはスニペットで明示的に include する。
#   - /css/chat.css は `location ^~ /css/`、fontawesome は `location ^~ /fontawesome-free-7.2.0-web/`
#     が webui を root にしているため、既に配信できる（追加不要）。
#   - /api/admin/chat/* は `location ^~ /api/admin` 経由（X-Tailnet-Admin 付与）で
#     既に動作する。
#   - アイコン（./icon.webp / ./icon-192.webp）も相対参照なので exact-match で拾う
#     （無くてもページは動くが、アバター画像が 404 になる）。
#
# 形式: 先頭のコメント行は除いて取り込まれ、適用スクリプトがそのまま差し込む。

location = /chat.html {
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    deny all;
    root /var/www/html/koinoyamai.love/webui;
    try_files /chat.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    include /etc/nginx/snippets/mai-security-headers.conf;
}
location = /chat.js {
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    deny all;
    root /var/www/html/koinoyamai.love/webui;
    try_files /chat.js =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    include /etc/nginx/snippets/mai-security-headers.conf;
}
location = /icon.webp {
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    deny all;
    root /var/www/html/koinoyamai.love/webui;
    try_files /icon.webp =404;
    include /etc/nginx/snippets/mai-security-headers.conf;
}
location = /icon-192.webp {
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    deny all;
    root /var/www/html/koinoyamai.love/webui;
    try_files /icon-192.webp =404;
    include /etc/nginx/snippets/mai-security-headers.conf;
}
