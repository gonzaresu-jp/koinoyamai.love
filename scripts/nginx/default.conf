## Default server configuration
#
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /var/www/html;

	index index.html index.htm index.nginx-debian.html;

	server_name _;

	# ---- 2026-09-13 流出遮断 ----
	# 1) 旧パス名（/mai-push 相当）は静的配信しない (webuiはexpress:8080経由)
	location ^~ /koinoyamai.love/ { deny all; }
	# 1.5) 2026-09-19 staging も同様に静的配信しない (test vhost経由のみ)
	location ^~ /koinoyamai.love-test/ { deny all; }
	# 2) ドットファイル(の.env/.git等)は全拒否 (well-known除く)
	location ~ /\.(?!well-known) { deny all; }
	location ^~ /\.well-known/ { allow all; }
	# 3) 機密拡張子も念のため拒否
	location ~* \.(env|db|db-wal|db-shm|sqlite|log|bak|key|pem|p12)$ { deny all; }
	# --------------------

	location / {
		try_files $uri $uri/ =404;
	}
}
