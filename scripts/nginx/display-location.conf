# display-location.conf — 旅先ディスプレイの nginx location（koinoyamai.love vhost 用）
#
# 用途:
#   https://koinoyamai.love/display/ で「旅先ディスプレイ」を静的配信する。
#   （smart-display リポジトリの `npm run build:display` の成果物を配置したもの）
#
# 設計:
#   - **同一オリジン**なので /api/history・/api/events/weekly・SSE は
#     既存の Express プロキシをそのまま利用できる（CORS 許可オリジンの追加が不要）。
#   - `^~` を付けて regex location（`location ~ \.php$` 等）に Priority を持たせない。
#   - **add_header を書かない**。これにより server レベルのセキュリティヘッダ
#     （CSP / X-Frame-Options / HSTS 等）がそのまま継承される
#     （nginx の add_header は Location に 1 つでもあれば server レベルを継承しない）。
#   - alias 先は Web 公開ツリー内の別ディレクトリ（/var/www/html/smart-display/）。
#     git 管理ツリー（/var/www/html/koinoyamai.love） 内に入れると
#     作業ツリーが dirty になるため置かない。
#
# 形式: 先頭のコメント行は除いて取り込まれ、インデントは適用スクリプトが付与する。

location = /display {
    return 301 /display/;
}

location ^~ /display/ {
    alias /var/www/html/smart-display/;
    index display.html;
    autoindex off;
}
