#     maintenance.conf - メンテナンスモードの nginx スニペット
#
# 何をするか:
#   **PHP の実行を止めて公開ページの攻撃面（PHP コア RCE）を閉じる。**
#   2026-10-21 の CVE-2026-109618 / CVE-2026-109619（CVSS v4.0 9.2・詳細未公開）は
#   回避策が不明なため、公開 PHP ページへの到達をnginx 側で遮断する。
#
# 設計:
#   - `location ~ \.php$` を **server ブロックの先頭に include** することで、
#     既存の `location ~ \.php$` より**先に**マッチさせる（nginx の regex location は
#     定義順で最初にマッチしたものが使われる）。→ php-fpm に到達しない＝PHP が実行されない
#   - **API（`location /api/`）とワーカーは止めない**。Node 側は PHP とは別ランタイムで
#     影響を受けず、通知（push）やデスクトップアプリの通信を維持できる。
#   - 静的ファイル（JS/CSS/画像）は従来どおり配信する（PHP 実行の遮断が目的のため）。
#   - 503 のページはサイト既存の /error/（webui/error/index.html・静的 HTML）。
#   - `add_header` を書くと server レベルの CSP 等が継承されなくなる（AGENTS.md §11）ため、
#     Retry-After / Cache-Control はこの Location 内だけに留め、**他は server レベルに任せる**。
#
# 適用:
#   sudo bash scripts/nginx/apply-maintenance.sh --on     # メンテナンス開始
#   sudo bash scripts/nginx/apply-maintenance.sh --off    # 解除
#
# 注意:
#   - `location = /status.php` のような**完全一致**の location は regex より優先される。
#     該当 vhost（1717 / staging）には存在しないが，新增する際は確認すること。
#   - elza vhost（:80）にある旧 PHP（`henkan/henkan.php` 等）は完全一致 location のため
#     このスニペットでは止まらない。`scripts/nginx/apply-php-exec-guard.sh` を使う。
#
# 形式: 先頭のコメント行は除いて取り込まれ、インデントは適用スクリプトが付与する。

location ~ \.php$ {
    # 503 のページは **サイト既存のメンテナンスページ**（/error/ = webui/error/index.html）を使う。
    #   - 既存デザイン（まいちゃん・背景・プラットフォームアイコン）をそのまま流用できる
    #   - 静的 HTML なので PHP を実行しない（＝この location 自身の RCE リスクも無い）
    #   - リポジトリ管理下なので配置・権限の管理が不要
    error_page 503 /error/;
    return 503;
}
