# staging: test.koinoyamai.love
# 導入: sudo cp /home/yuzuki/koinoyamai.love-test/scripts/nginx/mai-test.conf /etc/nginx/mai-test.conf
#       sudo sed -i '/^http {/a\    include /etc/nginx/mai-test.conf;' /etc/nginx/nginx.conf
#       sudo nginx -t && sudo systemctl reload nginx
# ※ /etc/nginx/nginx.conf は sites-enabled を include しないため http ブロック内へ直接 include する
server {
    listen 80;
    listen [::]:80;
    server_name test.koinoyamai.love;

    root /home/yuzuki/koinoyamai.love-test/webui;
    index index.php index.html;

    # Basic認証の代わりに、管理者セッション(adminToken cookie)でゲートをかける
    auth_request /_gate;
    error_page 401 =302 /admin/login/;

    # ログイン画面とその補助はゲート対象外（本番と同じ /admin/login/ エイリアス経由）
    location = /admin/login { return 301 /admin/login/; }
    location ^~ /admin/login/ {
        auth_request off;
        alias /home/yuzuki/koinoyamai.love-test/admin/;
        index login.html;
        try_files $uri $uri/ /login.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
    location = /admin/webauthn.js { auth_request off; }

    # ゲート本体（staging APIの /api/admin/verify で cookie認証）
    location = /_gate {
        internal;
        proxy_pass_request_body off;
        proxy_pass http://127.0.0.1:8081/api/admin/verify;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host test.koinoyamai.love;
        proxy_set_header X-Real-IP $remote_addr;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 静的アセット（FA/CSS/画像/スクリプト自体）は認証不要でも可（history.json等は認証のまま）
    location ~* \.(css|js|mjs|webp|png|jpg|jpeg|gif|svg|ico|woff2|woff|ttf)$ { auth_request off; }

    # API・SSE は staging API (:8081) へ（ゲート対象外: API側で独自にtoken認証）
    location /api/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # CF→nginxはhttpなのでCSRF判定用にhttpsを明示
        proxy_read_timeout 300s;
        proxy_buffering off;   # /api/events/stream (SSE) 用
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
