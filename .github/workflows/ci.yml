name: ci

# 公開リポジトリの機械検査（AGENTS.md §7.3 / §10.1）
#
# 1) Windows アプリのバージョン3箇所の整合
#    バージョンは csproj / installer.iss / UpdateChecker.cs に分散しており、
#    1箇所だけ更新すると「最新版なのに更新通知が出ない/出る」事故になる。
#    ビルド成果物を公開 repo に載せない運用なので、CI で守る。
# 2) JS / PHP の構文チェック
# 3) 回帰テスト（scripts/ops/regression-test.js）

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 静的検査・回帰テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 依存インストール
        run: npm ci

      - name: バージョン整合チェック
        run: bash scripts/ops/check-app-version.sh

      - name: 構文チェック（JS / PHP）
        run: |
          set -euo pipefail
          # package.json は commonjs のため node --check は ESM を弾く。
          # CJS として検査し、失敗したら ES module として再検査する
          # （scripts/hooks/pre-push と同じ方針）
          while IFS= read -r -d '' f; do
            if ! out=$(node --check "$f" 2>&1) && ! out=$(node --input-type=module --check < "$f" 2>&1); then
              echo "SYNTAX ERROR: $f"
              echo "$out" | head -3
              exit 1
            fi
          done < <(find . -path ./node_modules -prune -o -name '*.js' -not -path './webui/dist/*' -print0)
          find webui -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "構文チェック OK"

      - name: VAPID 鍵を生成（テスト用のローカルファイル・gitignore 済み）
        # services/notification.js が読むのは { vapidPublicKey, vapidPrivateKey }
        # （web-push の generateVAPIDKeys() は { publicKey, privateKey } を返すので変換する）
        run: |
          node -e "const wp=require('web-push');const k=wp.generateVAPIDKeys();require('fs').writeFileSync('vapid.json',JSON.stringify({vapidPublicKey:k.publicKey,vapidPrivateKey:k.privateKey}));"

      - name: 回帰テスト
        run: npm test

      - name: ネイティブモジュールの実動作 smoke
        # 回帰テストはネイティブモジュールを「require できる」ことしか見ないため、
        # 依存更新でネイティブ実体が壊れても気付けない（2026-10-21 レビュー指摘）。
        # 実際に変換・API 呼出しまで通して、ABI と実装の両方を確認する。
        run: |
          node -e "
          // sharp: 実際にエンコードする（libvips / N-API の整合）
          const sharp = require('sharp');
          sharp({ create: { width: 32, height: 32, channels: 3, background: { r: 255, g: 0, b: 0 } } })
            .jpeg().toBuffer()
            .then((b) => {
              if (!b || b.length === 0) throw new Error('sharp のエンコード結果が空');
              console.log('[smoke] sharp OK', b.length, 'bytes / vips', sharp.versions.vips);
            })
            .then(() => {
              // firebase-admin: FCM 送出に使う API の表面。
              // v14 は名前空間 API（admin.messaging / admin.credential）を廃止したため、
              // モジュラー API（firebase-admin/app, firebase-admin/messaging）を確認する。
              // services/notification.js が実際に使うものだけを検査する。
              const firebaseApp = require('firebase-admin/app');
              if (typeof firebaseApp.initializeApp !== 'function') throw new Error('firebase-admin/app.initializeApp が無い');
              if (typeof firebaseApp.getApps !== 'function') throw new Error('firebase-admin/app.getApps が無い');
              if (typeof firebaseApp.cert !== 'function') throw new Error('firebase-admin/app.cert が無い');
              const firebaseMsg = require('firebase-admin/messaging');
              if (typeof firebaseMsg.getMessaging !== 'function') throw new Error('firebase-admin/messaging.getMessaging が無い');
              console.log('[smoke] firebase-admin OK');
              // puppeteer: v25 は ESM のみ。require できる＝Node の版が仕様
              // （>=22.12）を満たし、ESM 相互運用が通っていることの確認。
              const puppeteer = require('puppeteer');
              if (typeof puppeteer.launch !== 'function') throw new Error('puppeteer.launch が無い');
              console.log('[smoke] puppeteer OK');
              // web-push: VAPID 設定が通るか（通知経路の入口）。
              // 鍵は前のステップで生成した vapid.json を使う（ハードコードしない）
              const wp = require('web-push');
              const vapid = require('./vapid.json');
              wp.setVapidDetails('mailto:ci@example.com', vapid.vapidPublicKey, vapid.vapidPrivateKey);
              console.log('[smoke] web-push OK');
              // sqlite3 / bcrypt: ネイティブのロードと実際の演算
              const sqlite3 = require('sqlite3');
              if (typeof sqlite3.Database !== 'function') throw new Error('sqlite3.Database が無い');
              const bcrypt = require('bcrypt');
              const h = bcrypt.hashSync('smoke', 4);
              if (!bcrypt.compareSync('smoke', h)) throw new Error('bcrypt の照合が失敗');
              console.log('[smoke] sqlite3 / bcrypt OK');
            })
            .catch((e) => { console.error('[smoke] NG:', e.message); process.exit(1); });
          "
