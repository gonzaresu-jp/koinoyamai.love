<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>まいAI チャット｜恋乃夜まい</title>
<link rel="icon" href="./icon.webp">
<link rel="stylesheet" href="/fontawesome-free-7.2.0-web/css/all.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="/css/chat.css?v=20261003a" />
</head>
<body>
  <div class="layout">
  <aside class="sidebar" id="sidebar">
    <button class="new-chat" id="newChat" type="button">＋ 新しいチャット</button>
    <div class="sess-list" id="sessList"></div>
  </aside>
  <div class="sidebar-scrim" id="scrim"></div>
  <div class="shell">
  <header class="chat-header">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" title="セッション一覧"><i class="fa-solid fa-bars"></i></button>
    <img class="avatar" src="./icon-192.webp" alt="恋乃夜まい">
    <div class="meta">
      <div class="name">恋乃夜まい <span class="heart"><i class="fa-solid fa-heart"></i></span> まいAI</div>
      <div class="sub" id="headerSub">恋の魔女 / だーりんの“ドキドキ”を待っています</div>
    </div>
    <button class="r18-toggle" id="r18Toggle" type="button" aria-pressed="false" title="大人のモードを切り替え"><i class="fa-solid fa-heart-circle-exclamation"></i></button>
    <button class="speak-toggle" id="speakToggle" type="button" aria-pressed="false" title="まいの声で自動読み上げ（トグル）"><i class="fa-solid fa-volume-high"></i></button>
    <button class="prefs-toggle" id="prefsToggle" type="button" aria-pressed="false" title="だーりんのお願い・好みを設定"><i class="fa-solid fa-heart"></i></button>
    <a class="home" href="./admin.html">管理画面</a>
  </header>

  <div class="chat-log" id="log" aria-live="polite"></div>

  <div class="prefs-panel" id="prefsPanel" hidden>
    <div class="prefs-head">だーりんのお願い・好み <span class="prefs-note">全チャット共通の設定（R18モードの演出に反映されます）</span></div>
    <label class="prefs-field">
      <span>好きなこと・してほしいこと（タグ）</span>
      <input id="prefLikes" type="text" placeholder="例: 耳舐め, キス, お世話（カンマ区切り）" autocomplete="off">
    </label>
    <label class="prefs-field">
      <span>苦手・やらないでほしいこと</span>
      <input id="prefDislikes" type="text" placeholder="例: 強引, 乱暴" autocomplete="off">
    </label>
    <label class="prefs-field">
      <span>望むシチュエーション</span>
      <input id="prefScene" type="text" placeholder="例: ねっとり耳元で囁かれながら" autocomplete="off">
    </label>
    <label class="prefs-field">
      <span>まいからの呼称</span>
      <input id="prefCall" type="text" placeholder="例: だーりん（空欄でデフォルト）" maxlength="50" autocomplete="off">
    </label>
    <div class="prefs-actions">
      <button class="prefs-save" id="prefsSave" type="button">保存</button>
      <span class="prefs-status" id="prefsStatus"></span>
    </div>
  </div>

  <div class="suggest" id="suggest">
    <button class="chip">次の配信はいつ？</button>
    <button class="chip">まいってどんな子？</button>
    <button class="chip">最近どんな配信してた？</button>
    <button class="chip">誕生日と身長は？</button>
  </div>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="君のドキドキ…聞かせて？（質問を入力）" autocomplete="off"></textarea>
    <button class="send-btn" id="send" type="submit" aria-label="送信"><i class="fa-solid fa-paper-plane"></i></button>
  </form>
  </div>
  </div>

<script src="./chat.js?v=20261003c"></script>
</body>
</html>
